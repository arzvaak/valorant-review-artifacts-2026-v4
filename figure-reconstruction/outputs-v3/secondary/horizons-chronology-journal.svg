   <g id="text_16">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start" x="21.204787" y="254.304" transform="rotate(-0 21.204787 254.304)">Prediction cutoff: scheduled start − 15 minutes; actual input publication unverified.</text>
