   <g id="text_17">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(21.204787 284.57475)">Core historical release: schedule + 2 hours. Online release: schedule + 6 hours.</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(21.204787 294.444813)">Only strictly earlier releases enter history; equal-time expectations remain frozen.</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(21.204787 304.314875)">Globals do not update history. The new unreviewed cohort is score-only.</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(21.204787 314.184937)">Roster and availability clocks are proxies; this diagram does not establish live availability.</text>
   </g>
   <g id="text_18">
